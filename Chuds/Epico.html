
<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Instant Runner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 3s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 0.4 },
                            '50%': { opacity: 0.8 },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090d16;
            color: #f1f5f9;
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Drag over glow state */
        .dropzone-active {
            border-color: #6366f1 !important;
            background-color: rgba(99, 102, 241, 0.08) !important;
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.25), inset 0 0 20px rgba(99, 102, 241, 0.15) !important;
            transform: scale(1.015);
        }
    </style>
</head>
<body class="h-full w-full flex flex-col items-center justify-center overflow-hidden relative select-none">

    <!-- Subtle Ambient Background Glows -->
    <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-indigo-600/15 rounded-full blur-[120px] pointer-events-none animation-pulse-glow"></div>
    <div class="absolute bottom-1/4 left-1/2 -translate-x-1/2 translate-y-1/2 w-[400px] h-[400px] bg-cyan-600/10 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Main Container -->
    <main class="w-full max-w-xl px-6 z-10">
        
        <!-- File Input (Hidden) -->
        <input type="file" id="fileInput" accept=".html,.htm" class="hidden">

        <!-- Drag and Drop Target Card -->
        <div id="dropzone" 
             onclick="document.getElementById('fileInput').click()"
             class="glass-panel group relative flex flex-col items-center justify-center p-10 md:p-14 rounded-3xl border-2 border-dashed border-slate-700/80 hover:border-indigo-500/70 transition-all duration-300 ease-out cursor-pointer shadow-2xl hover:shadow-indigo-500/10">
            
            <!-- Upload Icon Container -->
            <div id="iconContainer" class="w-20 h-20 mb-6 rounded-2xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-indigo-400 group-hover:text-indigo-300 group-hover:bg-indigo-950/40 group-hover:border-indigo-500/40 transition-all duration-300 shadow-inner group-hover:scale-110">
                <svg class="w-10 h-10 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
            </div>

            <!-- Main Heading & Subtext -->
            <div class="text-center space-y-2 pointer-events-none">
                <h1 class="text-xl md:text-2xl font-semibold text-slate-100 tracking-tight group-hover:text-white transition-colors">
                    Drop your HTML file here
                </h1>
                <p class="text-sm text-slate-400 group-hover:text-slate-300 transition-colors">
                    or <span class="text-indigo-400 underline underline-offset-4 font-medium">browse local files</span> to launch instantly
                </p>
            </div>

            <!-- File Format Tag -->
            <div class="mt-6 px-3 py-1 rounded-full bg-slate-800/60 border border-slate-700/50 text-xs font-mono text-slate-400">
                Supports .html &amp; .htm
            </div>

        </div>

        <!-- Status & Direct Fallback Action Card (Hidden by default) -->
        <div id="statusCard" class="hidden mt-6 glass-panel p-5 rounded-2xl border border-slate-700/50 space-y-4 animate-in fade-in slide-in-from-bottom-3 duration-300">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3 truncate">
                    <div class="w-9 h-9 rounded-xl bg-emerald-950/60 border border-emerald-500/30 flex items-center justify-center text-emerald-400 shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                    </div>
                    <div class="truncate">
                        <p id="fileName" class="text-sm font-medium text-slate-200 truncate">file_name.html</p>
                        <p id="fileSize" class="text-xs text-slate-400">0 KB</p>
                    </div>
                </div>
                
                <!-- Popup Blocker Warning Badge (if triggered) -->
                <span id="popupBadge" class="hidden text-[11px] px-2.5 py-1 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 font-medium">
                    Popup Blocked
                </span>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-3 pt-1">
                <!-- Primary Fallback Launch Button -->
                <button id="launchBtn" class="flex-1 py-2.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm transition-all duration-200 shadow-lg shadow-indigo-600/25 flex items-center justify-center space-x-2">
                    <span>Open in New Tab</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                </button>

                <!-- Copy Blob URL Button -->
                <button id="copyBtn" title="Copy URL" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white transition-all text-sm flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <!-- History Log (Session) -->
        <div id="historyContainer" class="hidden mt-6">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-1">Session History</h2>
            <div id="historyList" class="space-y-1.5 max-h-36 overflow-y-auto pr-1"></div>
        </div>

    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 translate-y-20 opacity-0 glass-panel border border-slate-700 text-slate-200 text-sm px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 pointer-events-none flex items-center space-x-2 z-50">
        <span id="toastMessage">Action completed</span>
    </div>

    <!-- Logic Script -->
    <script>
        // DOM Element references
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const statusCard = document.getElementById('statusCard');
        const fileNameEl = document.getElementById('fileName');
        const fileSizeEl = document.getElementById('fileSize');
        const popupBadge = document.getElementById('popupBadge');
        const launchBtn = document.getElementById('launchBtn');
        const copyBtn = document.getElementById('copyBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');
        const historyContainer = document.getElementById('historyContainer');
        const historyList = document.getElementById('historyList');

        let activeObjectUrl = null;
        let sessionHistory = [];

        // Utility: Format File Size
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        // Utility: Toast notification
        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Drag & Drop Event Handlers
        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.add('dropzone-active');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropzone.classList.remove('dropzone-active');
            }, false);
        });

        // Drop Event
        dropzone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            if (files.length > 0) {
                processFile(files[0]);
            }
        });

        // File Input Change Event
        fileInput.addEventListener('change', (e) => {
            if (fileInput.files.length > 0) {
                processFile(fileInput.files[0]);
            }
        });

        // File Processing Engine
        function processFile(file) {
            // Validate extension
            const isHtml = file.name.endsWith('.html') || file.name.endsWith('.htm') || file.type === 'text/html';
            
            if (!isHtml) {
                showToast('⚠️ Please drop a valid .html or .htm file');
                return;
            }

            // Create Blob URL directly from file (ensuring text/html MIME type)
            const htmlBlob = new Blob([file], { type: 'text/html;charset=utf-8' });
            
            // Revoke old object URL if present to release memory
            if (activeObjectUrl) {
                URL.revokeObjectURL(activeObjectUrl);
            }

            activeObjectUrl = URL.createObjectURL(htmlBlob);

            // Update UI elements
            fileNameEl.textContent = file.name;
            fileSizeEl.textContent = formatBytes(file.size);
            statusCard.classList.remove('hidden');

            // Set launch button click action
            launchBtn.onclick = () => {
                openInNewTab(activeObjectUrl);
            };

            // Set copy button action
            copyBtn.onclick = () => {
                document.execCommand('copy');
                // Standard fallback for clipboard
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(activeObjectUrl);
                }
                showToast('URL copied to clipboard!');
            };

            // Attempt synchronous tab opening
            const opened = openInNewTab(activeObjectUrl);

            if (!opened) {
                popupBadge.classList.remove('hidden');
                showToast('Popup blocked! Click "Open in New Tab" below.');
            } else {
                popupBadge.classList.add('hidden');
            }

            // Add to session history
            addToHistory(file.name, activeObjectUrl);
        }

        // Window open helper function with popup blocker check
        function openInNewTab(url) {
            try {
                const newWin = window.open(url, '_blank');
                if (!newWin || newWin.closed || typeof newWin.closed === 'undefined') {
                    return false;
                }
                newWin.focus();
                return true;
            } catch (err) {
                return false;
            }
        }

        // Add file to history log UI
        function addToHistory(name, url) {
            // Avoid duplicates at top
            sessionHistory = sessionHistory.filter(item => item.name !== name);
            sessionHistory.unshift({ name, url, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });

            if (sessionHistory.length > 5) sessionHistory.pop();

            renderHistory();
        }

        function renderHistory() {
            if (sessionHistory.length === 0) return;
            historyContainer.classList.remove('hidden');
            historyList.innerHTML = '';

            sessionHistory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'glass-panel px-3 py-2 rounded-xl border border-slate-800 flex items-center justify-between text-xs hover:border-slate-700 transition-colors';
                div.innerHTML = `
                    <span class="text-slate-300 font-mono truncate max-w-[220px]">${item.name}</span>
                    <div class="flex items-center space-x-2">
                        <span class="text-slate-500 text-[10px]">${item.time}</span>
                        <button class="text-indigo-400 hover:text-indigo-300 font-medium hover:underline" onclick="event.stopPropagation(); window.open('${item.url}', '_blank')">Re-open</button>
                    </div>
                `;
                historyList.appendChild(div);
            });
        }

        // Global drag & drop protection on window
        window.addEventListener('dragover', (e) => e.preventDefault());
        window.addEventListener('drop', (e) => e.preventDefault());
    </script>
</body>
</html>
